name: Release

# main에 머지된 커밋에 vX.Y.Z 태그를 푸시하면 실행된다 (절차: docs/RELEASE.md)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 버전·CHANGELOG 일치 확인
        run: node scripts/release.mjs check "${GITHUB_REF_NAME#v}"
      - name: 타입 검사 + 단위 테스트
        run: npm run typecheck && npm test
      - name: 웹 빌드
        run: |
          npx expo export --platform web --output-dir dist
          (cd dist && zip -qr "../strzone-web-${GITHUB_REF_NAME}.zip" .)
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
      - name: 릴리즈 노트 (CHANGELOG에서 추출)
        run: node scripts/release.mjs notes "${GITHUB_REF_NAME#v}" > notes.md
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in v0.*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $PRE \
            --title "스트존 $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "strzone-web-${GITHUB_REF_NAME}.zip" \
            docs/samples/round-story.png \
            docs/samples/controversy-story.png \
            docs/samples/controversy-clip.mp4
