name: EAS Build (스토어 빌드, 수동)

# iOS/Android 스토어 빌드. EXPO_TOKEN 시크릿과 `eas init`(projectId)이 준비되기 전에는 경고만 남기고 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 빌드 프로필
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - id: chk
        name: 준비 상태 확인
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN 시크릿이 없어 스토어 빌드를 건너뜁니다 (docs/RELEASE.md §4)"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chk.outputs.ok == '1'
        uses: actions/checkout@v4
      - if: steps.chk.outputs.ok == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.chk.outputs.ok == '1'
        run: npm ci
      - if: steps.chk.outputs.ok == '1'
        run: npx eas-cli@latest build --platform all --profile "${{ inputs.profile }}" --non-interactive --no-wait
