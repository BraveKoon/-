name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 테스트
        run: npm test
      - name: SQL ↔ TS 대조 검증 (PostgreSQL 16)
        run: npm run verify:sql
        env:
          PG_BASE_URL: postgresql://postgres:postgres@localhost:5432
      - name: 웹 번들 (Metro)
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
